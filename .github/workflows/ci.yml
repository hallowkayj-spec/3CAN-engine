name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-syntax:
    name: Lint + syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint and test tools
        run: pip install ruff==0.15.7 pytest

      - name: Ruff
        run: |
          ruff check neural-memory examples scripts

      - name: Python syntax
        run: python -m py_compile $(git ls-files '*.py')

  smoke-test:
    name: Release isolation + backend smoke
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-min.txt pytest

      - name: Pre-release isolation scan
        run: python scripts/prerelease_scan.py --strict

      - name: Error lifecycle and release tests
        run: python -m pytest neural-memory/tests -q

      - name: Cold-start backend + stats + route smoke
        run: |
          export THREECAN_GRAPH_DIR="$RUNNER_TEMP/3can-graph"
          export THREECAN_PROJECT_DIR="$RUNNER_TEMP/3can-project"
          export THREECAN_BASE_URL="http://127.0.0.1:9701"
          export THREECAN_MIN_NODES="10"
          export THREECAN_READINESS_MODE="development"
          export THREECAN_TOKEN_AUTO_IMPORT="0"
          mkdir -p "$THREECAN_PROJECT_DIR"
          python neural-memory/backend/seed_nodes.py
          python neural-memory/backend/app.py --port 9701 --host 127.0.0.1 &
          BACKEND_PID=$!
          for i in $(seq 1 30); do
            if curl -s --fail http://127.0.0.1:9701/api/stats > /dev/null 2>&1; then
              echo "Backend up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -s --fail http://127.0.0.1:9701/api/stats | python -c "import sys, json; d=json.load(sys.stdin); assert d['total_nodes'] >= 10; print(f'OK stats: {d}')"
          python scripts/verify_project.py --base-url http://127.0.0.1:9701 --min-nodes 10
          python - <<'PY'
          import json
          import urllib.request

          payload = {
              "task": "quickstart route api bootstrap standing orders token usage",
              "max_nodes": 4,
              "mode": "skeleton",
              "budget_tokens": 400,
              "agent_id": "ci-smoke",
              "confirm_low_confidence": True,
              "allow_degraded": True,
          }
          req = urllib.request.Request(
              "http://127.0.0.1:9701/api/route",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              data = json.load(resp)
          assert data.get("nodes"), data
          print("OK route:", data["nodes"][0]["id"])
          PY
          kill $BACKEND_PID || true

  secrets-scan:
    name: Secrets smoke scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for obvious secrets
        run: |
          set -e
          if git ls-files | xargs grep -lniE "api[_-]?key[[:space:]]*[:=][[:space:]]*['\"][a-z0-9]{20}|password[[:space:]]*[:=][[:space:]]*['\"][^'\"]{8}|sk-[a-z0-9]{30}" 2>/dev/null; then
            echo "::error::Potential secret literal committed. Review and remove."
            exit 1
          fi
          echo "No obvious secrets literals found."
