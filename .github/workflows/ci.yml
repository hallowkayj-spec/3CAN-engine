name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-syntax:
    name: Lint + syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint and test tools
        run: pip install ruff==0.15.7 pytest

      - name: Ruff
        run: |
          ruff check neural-memory examples scripts

      - name: Python syntax
        run: python -m py_compile $(git ls-files '*.py')

  smoke-test:
    name: Release isolation + tests
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-min.txt pytest

      - name: Pre-release isolation scan
        run: python scripts/prerelease_scan.py --strict

      - name: Error lifecycle and release tests
        run: python -m pytest neural-memory/tests -q


  clean-clone-acceptance:
    name: Clean clone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint-and-syntax
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal runtime
        run: pip install -r requirements-min.txt

      - name: Cold-start, exercise, and stop isolated 9701
        shell: pwsh
        env:
          THREECAN_BASE_URL: http://127.0.0.1:9701
          THREECAN_MIN_NODES: "10"
          THREECAN_READINESS_MODE: development
          THREECAN_EMBEDDING_BACKEND: hashing
          THREECAN_EMBEDDING_FALLBACK: hashing
          THREECAN_RERANKER_MODE: "off"
          THREECAN_TOKEN_AUTO_IMPORT: "0"
          THREECAN_ALLOW_UNTICKETED_ERROR_OCCURRENCES: "1"
          THREECAN_GRAPH_DIR: ${{ runner.temp }}/3can-graph
          THREECAN_PROJECT_DIR: ${{ runner.temp }}/public-rc-project
          THREECAN_ENGINE_ROOT: ${{ github.workspace }}/neural-memory
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Recurse -LiteralPath 'examples/codex-cli-project-kit' -Destination $env:THREECAN_PROJECT_DIR
          Copy-Item -LiteralPath '3CAN.md' -Destination (Join-Path $env:THREECAN_PROJECT_DIR '3CAN.md')
          Move-Item -LiteralPath (Join-Path $env:THREECAN_PROJECT_DIR '.agents/project.template.json') -Destination (Join-Path $env:THREECAN_PROJECT_DIR '.agents/project.json')
          $capsulePath = Join-Path $env:THREECAN_PROJECT_DIR '.agents/project.json'
          $capsule = Get-Content -LiteralPath $capsulePath -Raw | ConvertFrom-Json
          $capsule.project_id = 'public-rc'
          $capsule.project_namespace = 'public-scope'
          $capsule.project_name = '3CAN public RC fixture'
          $capsule.git_repository = 'github.com/public-rc/fixture'
          $capsule | ConvertTo-Json | Set-Content -LiteralPath $capsulePath -Encoding utf8NoBOM
          git -C $env:THREECAN_PROJECT_DIR init -b public-rc
          git -C $env:THREECAN_PROJECT_DIR remote add origin https://github.com/public-rc/fixture.git
          python -B neural-memory/backend/seed_nodes.py

          $stdout = Join-Path $env:RUNNER_TEMP '3can-9701.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP '3can-9701.stderr.log'
          $python = (Get-Command python).Source
          $arguments = @('-B', 'neural-memory/backend/app.py', '--port', '9701', '--host', '127.0.0.1')
          if ($IsWindows) {
            $backend = Start-Process -FilePath $python -ArgumentList $arguments -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          } else {
            $backend = Start-Process -FilePath $python -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          }

          $failure = $null
          try {
            $ready = $false
            foreach ($attempt in 1..60) {
              try {
                $stats = Invoke-RestMethod -Uri "$env:THREECAN_BASE_URL/api/stats" -TimeoutSec 2
                if ($stats.total_nodes -ge 10) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw 'isolated 9701 did not become ready'
            }
            python -B scripts/verify_project.py --base-url $env:THREECAN_BASE_URL --min-nodes 10 --project-id public-rc --project-namespace public-scope --exercise-writes
            if ($LASTEXITCODE -ne 0) {
              throw 'verify_project failed'
            }
            python -B (Join-Path $env:THREECAN_PROJECT_DIR 'scripts/3can_codex.py') --base-url $env:THREECAN_BASE_URL --engine-root $env:THREECAN_ENGINE_ROOT route --agent-id public-rc-project-kit --task 'current public RC project reality' --max-nodes 4 --budget-tokens 1400 --allow-degraded
            if ($LASTEXITCODE -ne 0) {
              throw 'project-kit route failed'
            }
          } catch {
            $failure = $_
          } finally {
            if ($backend -and -not $backend.HasExited) {
              Stop-Process -Id $backend.Id
              Wait-Process -Id $backend.Id -ErrorAction SilentlyContinue
            }
          }

          python -c "import socket; s=socket.socket(); s.settimeout(1); code=s.connect_ex(('127.0.0.1', 9701)); s.close(); assert code != 0, code; print('9701 released')"
          if ($LASTEXITCODE -ne 0) {
            throw '9701 listener remained after clean-clone acceptance'
          }
          if ($failure) {
            if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout -Tail 80 }
            if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Tail 80 }
            throw $failure
          }

  secrets-scan:
    name: Secrets smoke scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for obvious secrets
        run: |
          set -e
          if git ls-files | xargs grep -lniE "api[_-]?key[[:space:]]*[:=][[:space:]]*['\"][a-z0-9]{20}|password[[:space:]]*[:=][[:space:]]*['\"][^'\"]{8}|sk-[a-z0-9]{30}" 2>/dev/null; then
            echo "::error::Potential secret literal committed. Review and remove."
            exit 1
          fi
          echo "No obvious secrets literals found."
